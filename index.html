<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kauennedy</title>
  <meta name="description" content="Portfólio de Kauennedy, desenvolvedor de software iniciante.">
  <meta name="theme-color" content="#2b2b2b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b2b2b'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' text-anchor='middle' fill='white'%3EK%3C/text%3E%3C/svg%3E">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="dock">
      <button class="dock-btn" id="projects-btn" type="button" aria-expanded="false" aria-controls="projects-menu" aria-haspopup="true">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
        <span class="label" data-i18n="nav_projects">Projetos</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      <span class="dock-sep" aria-hidden="true"></span>

      <button class="dock-icon" id="theme-btn" type="button" aria-label="Mudar para o tema claro" title="Mudar para o tema claro">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></svg>
      </button>

      <span class="dock-sep" aria-hidden="true"></span>

      <button class="lang-btn" id="lang-btn" type="button" aria-label="Mudar idioma / Change language">EN</button>

      <!-- A lista é criada pelo topo.js; edite seus projetos lá -->
      <div class="menu" id="projects-menu" hidden>
        <ul class="menu-list" id="projects-list"></ul>
      </div>
    </div>
  </header>

  <main class="page">

    <a href="#inicio" class="avatar" aria-label="Início">
      <span class="avatar-fallback" aria-hidden="true"></span>
      <img src="https://avatars.githubusercontent.com/u/113468015?v=4" alt="foto de perfil de Kauennedy" onerror="this.remove()">
    </a>

    <section class="hero" id="inicio">
      <h1 data-i18n="hero_title">Olá, me chamo Kauennedy.</h1>
      <p class="lead" data-i18n="hero_text">Sou um desenvolvedor de software iniciante e esse é o meu primeiro projeto.</p>
    </section>

    <section class="details">
      <div class="block" id="sobre">
        <h2 data-i18n="about_title"></h2>
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
      </div>

      <div class="block" id="interesses">
        <h2 data-i18n="skills_title"></h2>
        <ul class="list">
          <li data-i18n="skill_1"></li>
        </ul>
      </div>

      <div class="block" id="contato">
        <h2 data-i18n="contact_title">Contato</h2>
        <p data-i18n="contact_text">Quer conversar? Me escreva:</p>
        <a class="mail" href="mailto:seuemail@exemplo.com">Kauennedy@gmail.com</a>
      </div>
    </section>

    <small class="footer" data-i18n="footer">© desenvolvido por Kauennedy com a ajuda do Claude AI</small>

  </main>

  <script src="script.js"></script>
  <script src="topo.js"></script>
</body>
</html>
